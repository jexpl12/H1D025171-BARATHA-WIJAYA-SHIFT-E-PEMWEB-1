<!DOCTYPE html>
<html lang="en">
<head>
    <title>Latihan</title>
</head>
<body>
    <form>
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" value="Romi" required>
        <br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="romi@gmail.com" required>
        <br>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="romi" required>
        <br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" value="1234" required>
        <br>

        <label for="gender">Jenis Kelamin</label>
        <select id="gender" name="gender" required>
            <option value="laki-laki">Laki-Laki</option>
            <option value="perempuan">Perempuan</option>
        </select>
        <br>

        <label for="alamat">Alamat</label>
        <textarea id="alamat" name="alamat" rows="10" cols="30" required>Bogor</textarea>
        <br>

        <input type="submit" value="Simpan">
    </form>
</body>
</html>
