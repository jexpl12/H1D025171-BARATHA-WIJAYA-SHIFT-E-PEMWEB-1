<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan HTML CSS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: white;
        }

        .container {
            width: 90%;
            max-width: 800px;
            height: 650px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header {
            height: 130px;
            border: 3px solid black;
        }

        .content {
            flex: 1;
            border: 3px solid black;
        }

        .footer {
            height: 45px;
            border: 3px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header"></div>
        <div class="content"></div>
        <div class="footer"></div>
    </div>
</body>

</html>
